# Build unsigned Mauwork desktop installers for every target on GitHub-hosted runners and
# attach them to the GitHub Release named by the pushed tag.
#
# Push a tag such as zr-0.0.1 to build and publish; the workflow also supports a manual
# dispatch that builds Actions artifacts only unless a release tag is supplied. Upstream's
# Package Desktop workflows target self-hosted signing runners; this fork workflow publishes
# unsigned builds.
#
# Windows packaging reads its deployment values from apps/desktop/.env.windows, not the
# process environment, so the build writes that file from repository variables (or the
# defaults below) before running the packaging command. Unsigned macOS builds ignore
# .env.macos and use the product application identifier.
#
# A Windows build embeds the generic update feed and, on a release, publishes the feed and
# installer to Aliyun OSS (dsh-desk/<release-id>/feeds/win-x64); unsigned macOS builds have no
# updater because Squirrel.Mac verifies the bundle signature. Configure OSS_ACCESS_KEY_ID,
# OSS_ACCESS_KEY_SECRET, and optionally OSS_BUCKET, OSS_REGION, OSS_ENDPOINT and
# MAUWORK_DOWNLOAD_ORIGIN; the bucket must be publicly readable at that origin.
name: Release Desktop · unsigned

on:
  push:
    tags:
      - 'zr-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, such as zr-0.0.1. Leave empty to build Actions artifacts only.'
        type: string
        default: ''
        required: false
      build_version:
        description: 'Optional --build-version override. Leave empty to package the product version.'
        type: string
        default: ''
        required: false
      publish:
        description: 'Publish the GitHub Release immediately instead of leaving it as a draft.'
        type: boolean
        default: false
        required: true

permissions:
  contents: write

env:
  # One fixed test feed keeps every tag on the same OSS update path.
  FEED_RELEASE_ID: 0123456789abcdef0123456789abcdef

concurrency:
  group: desktop-release-unsigned-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The packaging entry only accepts a build version that extends the product version in
      # package.json, so a zr-0.0.1 tag becomes 0.2.1-rc.2.0.0.1 rather than 0.0.1.
      - name: Resolve the build version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REQUESTED: ${{ inputs.build_version }}
        run: |
          product=$(node -p "require('./package.json').version")
          build=""
          if [ -n "$REQUESTED" ]; then
            build="$REQUESTED"
          elif [ "$EVENT_NAME" = "push" ] && [[ "$TAG" =~ ^zr-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            build="$product.${BASH_REMATCH[1]}"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      MAUWORK_APP_ID: ${{ vars.MAUWORK_APP_ID || 'com.mauwork.desktop' }}
      MAUWORK_UPDATE_ORIGIN: ${{ vars.MAUWORK_UPDATE_ORIGIN || 'https://mioagent.dev.zrshuiwu.com' }}
      MAUWORK_DOWNLOAD_ORIGIN: ${{ vars.MAUWORK_DOWNLOAD_ORIGIN || 'https://mauwork-releases.oss-cn-hangzhou.aliyuncs.com' }}
      BUILD_VERSION: ${{ needs.version.outputs.build }}
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Check out the pushed tag
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Write the unsigned packaging configuration
        run: |
          $origin = $env:MAUWORK_UPDATE_ORIGIN
          $config = '{"allowedAuthOrigins":["' + $origin + '"]}'
          $lines = @(
            "DSH_DESKTOP_APP_ID=$env:MAUWORK_APP_ID"
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test'
            "DOWNLOAD_TEST_ORIGIN=$env:MAUWORK_DOWNLOAD_ORIGIN"
            "DOWNLOAD_TEST_RELEASE_ID=$env:FEED_RELEASE_ID"
            'DSH_DESKTOP_UNSIGNED_UPDATE=1'
            "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=$origin"
            "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='$config'"
          )
          [IO.File]::WriteAllText((Join-Path $PWD 'apps/desktop/.env.windows'), ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - name: Build the unsigned Windows x64 installer
        run: |
          $packageArgs = @('run', 'package:desktop:win:x64:unsigned')
          if ($env:BUILD_VERSION -ne '') { $packageArgs += @('--build-version', $env:BUILD_VERSION) }
          pnpm @packageArgs
          exit $LASTEXITCODE
      - name: Retain the Windows installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mauwork-windows-x64-unsigned
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.blockmap
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.yml
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    needs: version
    runs-on: macos-14
    timeout-minutes: 240
    env:
      BUILD_VERSION: ${{ needs.version.outputs.build }}
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Check out the pushed tag
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the unsigned macOS arm64 disk image
        run: |
          args=()
          if [ -n "$BUILD_VERSION" ]; then args+=(--build-version "$BUILD_VERSION"); fi
          pnpm run package:desktop:mac:arm64:unsigned "${args[@]}"
      - name: Retain the macOS arm64 disk image
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mauwork-macos-arm64-unsigned
          path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14

  macos-x64:
    needs: version
    # A native Intel host avoids running the x64 Electron, LibreOffice and the runtime smoke under Rosetta.
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      BUILD_VERSION: ${{ needs.version.outputs.build }}
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Check out the pushed tag
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the unsigned macOS x64 disk image
        run: |
          args=()
          if [ -n "$BUILD_VERSION" ]; then args+=(--build-version "$BUILD_VERSION"); fi
          pnpm run package:desktop:mac:x64:unsigned "${args[@]}"
      - name: Retain the macOS x64 disk image
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mauwork-macos-x64-unsigned
          path: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish-oss:
    needs: windows
    if: >-
      always() && !cancelled()
      && (github.event_name == 'push' || inputs.release_tag != '')
      && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: mauwork-windows-x64-unsigned
          path: dist
      - name: Publish the Windows update feed to Aliyun OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET || 'mauwork-releases' }}
          OSS_REGION: ${{ vars.OSS_REGION || 'cn-hangzhou' }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          FEED_PREFIX: dsh-desk/${{ env.FEED_RELEASE_ID }}/feeds/win-x64
        run: |
          if [ -z "$OSS_ACCESS_KEY_ID" ] || [ -z "$OSS_ACCESS_KEY_SECRET" ]; then
            echo 'OSS_ACCESS_KEY_ID and OSS_ACCESS_KEY_SECRET are not configured.' >&2
            exit 1
          fi
          shopt -s nullglob
          payload=(dist/*.exe dist/*.blockmap)
          if [ ${#payload[@]} -eq 0 ]; then echo 'No installer artifact was downloaded.' >&2; exit 1; fi
          if [ ! -f dist/nightly.yml ] && [ ! -f dist/latest.yml ]; then echo 'No update metadata was produced.' >&2; exit 1; fi
          python3 -m pip install --user boto3 >/dev/null 2>&1
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          from boto3.s3.transfer import TransferConfig

          endpoint = os.environ.get('OSS_ENDPOINT', '').strip() or 'https://oss-cn-hangzhou.aliyuncs.com'
          bucket = os.environ.get('OSS_BUCKET', '').strip() or 'mauwork-releases'
          region = os.environ.get('OSS_REGION', '').strip() or 'cn-hangzhou'
          prefix = os.environ['FEED_PREFIX'].strip()

          s3 = boto3.client(
              's3',
              endpoint_url=endpoint,
              region_name=region,
              aws_access_key_id=os.environ['OSS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['OSS_ACCESS_KEY_SECRET'],
              config=Config(
                  signature_version='s3',
                  s3={'addressing_style': 'virtual'},
                  retries={'max_attempts': 10, 'mode': 'adaptive'},
                  connect_timeout=10,
                  read_timeout=120,
                  max_pool_connections=32,
              ),
          )
          transfer = TransferConfig(max_concurrency=16, multipart_threshold=64 * 1024 * 1024, multipart_chunksize=16 * 1024 * 1024)

          def exists(key, size):
              try:
                  return s3.head_object(Bucket=bucket, Key=key).get('ContentLength') == size
              except ClientError as error:
                  code = error.response.get('Error', {}).get('Code', '')
                  if code in ('404', 'NotFound', 'NoSuchKey', 'NoSuchBucket'):
                      return False
                  raise

          def upload(path, force=False):
              key = f'{prefix}/{path.name}'
              size = path.stat().st_size
              if not force and exists(key, size):
                  print(f'skipped {path.name} (already on OSS)', flush=True)
                  return
              s3.upload_file(str(path), bucket, key, Config=transfer)
              print(f'uploaded {path.name} ({size / 1024 / 1024:.1f} MiB)', flush=True)

          metadata = {'nightly.yml', 'latest.yml'}
          # Installers and blockmaps first; metadata last so no client reads a feed whose payload is missing.
          for path in sorted(Path('dist').iterdir()):
              if path.is_file() and path.name not in metadata and path.suffix != '.yml':
                  upload(path)
          for path in sorted(Path('dist').iterdir()):
              if path.is_file() and path.name in metadata:
                  upload(path, force=True)
          print(f'published {prefix}/ to {bucket}')
          PY

  release:
    needs: [version, windows, macos-arm64, macos-x64]
    if: >-
      always() && !cancelled()
      && (github.event_name == 'push' || inputs.release_tag != '')
      && needs.version.result == 'success'
      && needs.windows.result == 'success'
      && needs.macos-arm64.result == 'success'
      && needs.macos-x64.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: mauwork-*
          path: dist
          merge-multiple: true
      - name: Attach the installers to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          TARGET_SHA: ${{ needs.windows.outputs.sha }}
          BUILD_VERSION: ${{ needs.version.outputs.build }}
        run: |
          notes="Unsigned Windows x64 and macOS arm64/x64 builds. Windows SmartScreen and macOS Gatekeeper will warn about the missing signature, and automatic updates are not configured."
          if [ -n "$BUILD_VERSION" ]; then notes="$notes Build version: $BUILD_VERSION."; fi
          draft=()
          if [ "$PUBLISH" != "true" ]; then draft+=(--draft); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$EVENT_NAME" = "push" ]; then
              gh release create "$RELEASE_TAG" --verify-tag "${draft[@]}" \
                --title "Mauwork $RELEASE_TAG (unsigned)" \
                --notes "$notes"
            else
              target=()
              if [ -n "$TARGET_SHA" ]; then target+=(--target "$TARGET_SHA"); fi
              gh release create "$RELEASE_TAG" "${target[@]}" "${draft[@]}" \
                --title "Mauwork $RELEASE_TAG (unsigned)" \
                --notes "$notes"
            fi
          fi
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.blockmap)
          if [ ${#files[@]} -eq 0 ]; then echo 'No installer artifact was downloaded.' >&2; exit 1; fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
