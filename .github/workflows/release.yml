name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v1.2.3 or v1.2.3-beta.1).
        required: true
        type: string
  push:
    tags:
      - v*.*.*
      - zr-*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  preflight:
    name: release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Resolve and validate release source
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            release_tag="${DISPATCH_TAG}"
          else
            release_tag="${REF_NAME}"
          fi
          if [[ -z "${release_tag}" ]] || ! git check-ref-format "refs/tags/${release_tag}" >/dev/null; then
            echo 'Release tag is missing or invalid.' >&2
            exit 1
          fi

          git fetch --force --tags origin
          if ! git show-ref --verify --quiet "refs/tags/${release_tag}"; then
            echo "Release tag ${release_tag} does not exist." >&2
            exit 1
          fi
          source_sha="$(git rev-parse --verify "refs/tags/${release_tag}^{commit}")"
          if [[ ! "${source_sha}" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Release tag did not resolve to an immutable commit SHA.' >&2
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "${source_sha}" origin/main; then
            echo 'Release tags must resolve to commits reachable from origin/main.' >&2
            exit 1
          fi
          git checkout --detach "${source_sha}"

          node scripts/ci/release-preflight.mjs \
            --tag "${release_tag}" \
            --source-sha "${source_sha}" \
            --output-dir release-preflight

          version="$(node -p "JSON.parse(require('fs').readFileSync('release-preflight/release-context.json', 'utf8')).version")"
          prerelease="$(node -p "String(JSON.parse(require('fs').readFileSync('release-preflight/release-context.json', 'utf8')).prerelease)")"
          {
            echo "tag=${release_tag}"
            echo "sha=${source_sha}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release preflight
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deepchat-release-preflight
          path: |
            release-preflight/release-context.json
            release-preflight/release-notes.md
          if-no-files-found: error
          overwrite: true

  package-windows:
    name: release-windows(${{ matrix.arch }})
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    uses: ./.github/workflows/_package-windows.yml
    with:
      source-sha: ${{ needs.preflight.outputs.sha }}
      arch: ${{ matrix.arch }}
      artifact-purpose: distribution
      enforce-installer-size: true
    secrets:
      RTK_GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN }}
      DC_GITHUB_CLIENT_ID: ${{ secrets.DC_GITHUB_CLIENT_ID }}
      DC_GITHUB_CLIENT_SECRET: ${{ secrets.DC_GITHUB_CLIENT_SECRET }}
      DC_GITHUB_REDIRECT_URI: ${{ secrets.DC_GITHUB_REDIRECT_URI }}

  package-macos:
    name: release-macos(${{ matrix.arch }})
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    uses: ./.github/workflows/_package-macos.yml
    with:
      source-sha: ${{ needs.preflight.outputs.sha }}
      arch: ${{ matrix.arch }}
      artifact-purpose: distribution
      enforce-installer-size: true
    secrets:
      RTK_GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN }}
      DC_GITHUB_CLIENT_ID: ${{ secrets.DC_GITHUB_CLIENT_ID }}
      DC_GITHUB_CLIENT_SECRET: ${{ secrets.DC_GITHUB_CLIENT_SECRET }}
      DC_GITHUB_REDIRECT_URI: ${{ secrets.DC_GITHUB_REDIRECT_URI }}
      DEEPCHAT_CSC_LINK: ${{ secrets.DEEPCHAT_CSC_LINK }}
      DEEPCHAT_CSC_KEY_PASS: ${{ secrets.DEEPCHAT_CSC_KEY_PASS }}
      DEEPCHAT_APPLE_NOTARY_USERNAME: ${{ secrets.DEEPCHAT_APPLE_NOTARY_USERNAME }}
      DEEPCHAT_APPLE_NOTARY_TEAM_ID: ${{ secrets.DEEPCHAT_APPLE_NOTARY_TEAM_ID }}
      DEEPCHAT_APPLE_NOTARY_PASSWORD: ${{ secrets.DEEPCHAT_APPLE_NOTARY_PASSWORD }}

  assemble:
    name: assemble-release
    needs: [preflight, package-windows, package-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install assembly dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download Windows x64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: miowork-package-win32-x64-distribution
          path: artifacts/miowork-package-win32-x64
          digest-mismatch: error

      - name: Download Windows ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: miowork-package-win32-arm64-distribution
          path: artifacts/miowork-package-win32-arm64
          digest-mismatch: error

      - name: Download macOS x64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: miowork-package-darwin-x64-distribution
          path: artifacts/miowork-package-darwin-x64
          digest-mismatch: error

      - name: Download macOS ARM64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: miowork-package-darwin-arm64-distribution
          path: artifacts/miowork-package-darwin-arm64
          digest-mismatch: error

      - name: Assemble fail-closed release assets
        env:
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node scripts/ci/assemble-release.mjs \
            --artifacts-dir artifacts \
            --output-dir release-assets \
            --source-sha "${RELEASE_SOURCE_SHA}" \
            --version "${RELEASE_VERSION}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deepchat-release-assets
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: create-draft-release
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deepchat-release-assets
          path: release-assets
          digest-mismatch: error

      - name: Download release preflight
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deepchat-release-preflight
          path: release-preflight
          digest-mismatch: error

      - name: Revalidate release context and local assets
        env:
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node scripts/ci/release-preflight.mjs \
            --tag "${RELEASE_TAG}" \
            --source-sha "${RELEASE_SOURCE_SHA}" \
            --output-dir expected-release-preflight
          cmp expected-release-preflight/release-context.json release-preflight/release-context.json
          cmp expected-release-preflight/release-notes.md release-preflight/release-notes.md
          node scripts/ci/verify-release-assets.mjs local \
            --directory release-assets \
            --source-sha "${RELEASE_SOURCE_SHA}" \
            --version "${RELEASE_VERSION}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Reject unknown assets in an existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > existing-releases.json
          release_count="$(
            jq --arg tag "${RELEASE_TAG}" '[.[][] | select(.tag_name == $tag)] | length' \
              existing-releases.json
          )"
          if [[ "${release_count}" -gt 1 ]]; then
            echo "Found multiple releases for ${RELEASE_TAG}." >&2
            exit 1
          fi
          if [[ "${release_count}" -eq 1 ]]; then
            release_id="$(
              jq -r --arg tag "${RELEASE_TAG}" \
                '.[][] | select(.tag_name == $tag) | .id' existing-releases.json
            )"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > existing-release.json
            node scripts/ci/verify-release-assets.mjs remote \
              --directory release-assets \
              --source-sha "${RELEASE_SOURCE_SHA}" \
              --version "${RELEASE_VERSION}" \
              --workflow-run-id "${GITHUB_RUN_ID}" \
              --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --release-json existing-release.json \
              --tag "${RELEASE_TAG}" \
              --prerelease "${RELEASE_PRERELEASE}" \
              --allow-partial-assets
          fi

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.sha }}
          name: MioWork V${{ needs.preflight.outputs.version }}
          draft: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
          body_path: release-preflight/release-notes.md

      - name: Verify published draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
        run: |
          endpoint="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          for attempt in 1 2 3 4 5; do
            if gh api \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "${endpoint}" > published-release.json &&
              node scripts/ci/verify-release-assets.mjs remote \
              --directory release-assets \
              --source-sha "${RELEASE_SOURCE_SHA}" \
              --version "${RELEASE_VERSION}" \
              --workflow-run-id "${GITHUB_RUN_ID}" \
              --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --release-json published-release.json \
              --tag "${RELEASE_TAG}" \
              --prerelease "${RELEASE_PRERELEASE}"
            then
              exit 0
            fi
            if [[ "${attempt}" -lt 5 ]]; then
              sleep "$((attempt * 2))"
            fi
          done
          echo 'Published draft assets did not converge to the release contract.' >&2
          exit 1

  mirror-oss:
    name: mirror-to-aliyun-oss
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deepchat-release-assets
          path: release-assets
          digest-mismatch: error

      - name: Sync release assets to Aliyun OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          # 可选：在 OSS 控制台开启传输加速后，把仓库变量 OSS_ENDPOINT 设为
          # https://oss-accelerate.aliyuncs.com 可显著加快海外 runner 的上传。
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          # aws-cli 对自定义 endpoint 强制 path-style，而新 OSS bucket 拒绝 path-style
          # （SecondLevelDomainForbidden）。改用官方文档验证过的 boto3 + virtual addressing：
          # 请求落到 miowork-releases.oss-cn-hangzhou.aliyuncs.com/updates/...。
          python3 -m pip install --user boto3 >/dev/null 2>&1
          python3 - <<'PYEOF'
          import os
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          from boto3.s3.transfer import TransferConfig

          endpoint = os.environ.get('OSS_ENDPOINT', '').strip() or 'https://oss-cn-hangzhou.aliyuncs.com'
          bucket = 'miowork-releases'
          prefix = 'updates'

          s3 = boto3.client(
              's3',
              endpoint_url=endpoint,
              region_name='cn-hangzhou',
              aws_access_key_id=os.environ['OSS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['OSS_ACCESS_KEY_SECRET'],
              config=Config(
                  signature_version='s3',
                  s3={'addressing_style': 'virtual'},
                  retries={'max_attempts': 10, 'mode': 'adaptive'},
                  connect_timeout=10,
                  read_timeout=60,
                  max_pool_connections=128,
              ),
          )
          transfer = TransferConfig(
              max_concurrency=32,
              multipart_threshold=64 * 1024 * 1024,
              multipart_chunksize=16 * 1024 * 1024,
          )

          def head_size(key):
              try:
                  return s3.head_object(Bucket=bucket, Key=key).get('ContentLength')
              except ClientError as error:
                  code = error.response.get('Error', {}).get('Code', '')
                  if code in ('404', 'NotFound', 'NoSuchKey', 'NoSuchBucket'):
                      return None
                  raise

          def abort_incomplete():
              # 可选优化：清理上次失败遗留的未完成分片。RAM 子账号若没有
              # oss:ListMultipartUploads 权限会抛 AccessDenied，此时跳过即可。
              try:
                  uploads = s3.list_multipart_uploads(
                      Bucket=bucket, Prefix=f'{prefix}/'
                  ).get('Uploads', [])
              except ClientError as error:
                  print(f'warning: cannot list multipart uploads ({error}); skipping cleanup', flush=True)
                  return
              for upload in uploads:
                  s3.abort_multipart_upload(
                      Bucket=bucket,
                      Key=upload['Key'],
                      UploadId=upload['UploadId'],
                  )
              if uploads:
                  print(f'aborted {len(uploads)} incomplete multipart uploads', flush=True)

          def upload_one(name, force=False):
              path = os.path.join('release-assets', name)
              key = f'{prefix}/{name}'
              size = os.path.getsize(path)
              # 元数据文件（latest.yml/latest-mac.yml/release-index.json）每次
              # 内容都变（版本号、sha512、sourceCommit、workflowRunId），且与旧版
              # 本文件大小往往相同，按大小跳过会误判"已存在"导致更新指针不刷新，
              # 因此必须强制覆盖。
              if not force and head_size(key) == size:
                  return name, 'skip', size, 0.0
              started = time.monotonic()
              s3.upload_file(path, bucket, key, Config=transfer)
              return name, 'upload', size, time.monotonic() - started

          abort_incomplete()
          names = sorted(os.listdir('release-assets'))
          metadata = ('latest.yml', 'latest-mac.yml')
          payload = [name for name in names if name not in metadata]
          # 先上传安装包/blockmap，最后再传 latest.yml/latest-mac.yml，
          # 避免客户端读到引用尚未上传文件的版本信息。
          started = time.monotonic()
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = [pool.submit(upload_one, name) for name in payload]
              for future in as_completed(futures):
                  name, action, size, elapsed = future.result()
                  if action == 'upload':
                      print(
                          f'uploaded {name} ({size / 1024 / 1024:.1f} MiB in {elapsed:.0f}s, '
                          f'{size / 1024 / 1024 / elapsed:.1f} MiB/s)',
                          flush=True,
                      )
                  else:
                      print(f'skipped {name} (already on OSS)', flush=True)
          # release-index.json 同样每次内容都变，强制覆盖
          upload_one('release-index.json', force=True)
          for name in metadata:
              upload_one(name, force=True)
          total_elapsed = time.monotonic() - started
          listed = s3.list_objects_v2(Bucket=bucket, Prefix=f'{prefix}/').get(
              'Contents', []
          )
          print(
              f'mirrored {len(names)} files in {total_elapsed:.0f}s; '
              f'OSS now holds {len(listed)} objects under {prefix}/',
              flush=True,
          )
          PYEOF
